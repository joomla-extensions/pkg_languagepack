COM_LANGUAGE_PACK_JOOMLA_VERSION_1_0_DESC="Joomla 1.0 incluye %d paquetes de idiomas acreditados que puede instalar en su sitio web, además del idioma fuente, inglés (británico).<br><br><i>Tenga en cuenta que el soporte para la versión Joomla 1.0 finalizó el 22 de julio de 2009. Le recomendamos encarecidamente que actualice a una versión compatible.</i>"
COM_LANGUAGE_PACK_JOOMLA_VERSION_1_5_DESC="Joomla 1.5 incluye %d paquetes de idiomas acreditados que puede instalar en su sitio web, además del idioma fuente, inglés (británico).<br><br><i>Tenga en cuenta que el soporte para la versión Joomla 1.5 finalizó el 31 de diciembre de 2012. Le recomendamos encarecidamente que actualice a una versión compatible.</i>"
COM_LANGUAGE_PACK_JOOMLA_VERSION_2_5_DESC="Joomla 2.5 incluye %d paquetes de idiomas acreditados que puede instalar en su sitio web, además del idioma fuente, inglés (británico).<br><br><i>Tenga en cuenta que el soporte para la versión Joomla 2.5 finalizó el 31 de diciembre de 2014. Le recomendamos encarecidamente que actualice a una versión compatible.</i>"
COM_LANGUAGE_PACK_JOOMLA_VERSION_3_X_DESC="Además del idioma de origen, inglés (británico), Joomla 3.x incluye %d paquetes de idiomas acreditados que puede instalar directamente desde el panel de administración de su sitio, lo que le permite personalizar la configuración de idioma para satisfacer las necesidades de los usuarios y administradores de su sitio."
COM_LANGUAGE_PACK_JOOMLA_VERSION_4_X_DESC="Además del idioma de origen, inglés (británico), Joomla 4.x incluye %d paquetes de idiomas acreditados que puede instalar directamente desde el panel de administración de su sitio, lo que le permite personalizar la configuración de idioma para satisfacer las necesidades de los usuarios y administradores de su sitio."
COM_LANGUAGE_PACK_JOOMLA_VERSION_5_X_DESC="Además del idioma de origen, inglés (británico), Joomla 5.x incluye %d paquetes de idiomas acreditados que puede instalar directamente desde el panel de administración de su sitio, lo que le permite personalizar la configuración de idioma para satisfacer las necesidades de los usuarios y administradores de su sitio."
COM_LANGUAGE_PACK_JOOMLA_VERSION_6_X_DESC="Además del idioma de origen, inglés (británico), Joomla 6.x incluye %d paquetes de idiomas acreditados que puede instalar directamente desde el panel de administración de su sitio, lo que le permite personalizar la configuración de idioma para satisfacer las necesidades de los usuarios y administradores de su sitio."

COM_LANGUAGE_PACK_JOOMLA_VERSION_3_0_EXTRA_INFO_0_BODY="<p>Es fácil traducir Joomla! a tu idioma <a href=\"https://docs.joomla.org/J3.1:Making_a_Language_Pack_for_Joomla\">creando un paquete de idioma 3.x</a>.</p>"
COM_LANGUAGE_PACK_JOOMLA_VERSION_3_0_EXTRA_INFO_0_TITLE="Cómo crear una traducción de Joomla!"
COM_LANGUAGE_PACK_JOOMLA_VERSION_3_0_EXTRA_INFO_1_BODY="<p>Existen numerosos recursos valiosos para agregar tu idioma a Joomla y obtener más información sobre el <a href=\"https://volunteers.joomla.org/teams/joomla-cms-language-team\">Equipo de Idiomas de Joomla! CMS (Core)</a>. Puedes hacer preguntas y obtener consejos en el <a href=\"https://forum.joomla.org/viewforum.php?f=11\">Foro de Traducciones</a> o en el <a href=\"https://forum.joomla.org/viewforum.php?f=617\">Foro de Idiomas</a>, y encontrarás una gran cantidad de recursos en el <a href=\"https://forum.joomla.org/viewforum.php?f=511\">Foro de la Zona Internacional</a>.</p>"
COM_LANGUAGE_PACK_JOOMLA_VERSION_3_0_EXTRA_INFO_1_TITLE="Más información sobre traducciones"
COM_LANGUAGE_PACK_JOOMLA_VERSION_3_0_EXTRA_INFO_2_BODY="<p>Póngase en contacto con el <a href=\"https://volunteers.joomla.org/teams/joomla-cms-language-team\">Equipo de Idiomas de Joomla! CMS (Núcleo)</a></p>"
COM_LANGUAGE_PACK_JOOMLA_VERSION_3_0_EXTRA_INFO_2_TITLE="¿Quiere proponer paquetes para un idioma no listado aquí?"
COM_LANGUAGE_PACK_JOOMLA_VERSION_3_0_EXTRA_INFO_3_BODY="Por favor, póngase en contacto con el coordinador de idiomas indicado en la lista de abajo."
COM_LANGUAGE_PACK_JOOMLA_VERSION_3_0_EXTRA_INFO_3_TITLE="¿Tiene algún problema con la calidad de una traducción o desea colaborar con un equipo existente?"
COM_LANGUAGE_PACK_JOOMLA_VERSION_3_0_EXTRA_INFO_4_BODY="<p><a href=\"https://docs.joomla.org/J3.x:Setup_a_Multilingual_Site\">Configure un sitio multilingüe fácilmente</a>.</p>"
COM_LANGUAGE_PACK_JOOMLA_VERSION_3_0_EXTRA_INFO_4_TITLE="Información sobre nuevas funcionalidades de idioma en Joomla 3.x"

COM_LANGUAGE_PACK_JOOMLA_VERSION_4_0_EXTRA_INFO_0_BODY="<p>Es fácil traducir Joomla a tu idioma utilizando nuestra plataforma de traducción: <a href=\"https://joomla.crowdin.com/cms\"></a>.</p>"
COM_LANGUAGE_PACK_JOOMLA_VERSION_4_0_EXTRA_INFO_0_TITLE="Cómo crear una traducción de Joomla!"
COM_LANGUAGE_PACK_JOOMLA_VERSION_4_0_EXTRA_INFO_1_BODY="<p>Póngase en contacto con el <a href=\"https://volunteers.joomla.org/teams/joomla-cms-language-team\">Equipo de Idiomas de Joomla! CMS (Núcleo)</a>, <br>Cree una solicitud en el <a href=\"https://github.com/joomla/core-translations/issues\">repositorio de GitHub</a>, <br>o póngase en contacto con uno de los administradores a través del <a href=\"https://joomla.crowdin.com/cms#managers\" target=\"_blank\" rel=\"noopener noreferrer\">Proyecto Crowdin CMS</a>.</p>"
COM_LANGUAGE_PACK_JOOMLA_VERSION_4_0_EXTRA_INFO_1_TITLE="¿Quiere proponer paquetes para un idioma no listado aquí?"
COM_LANGUAGE_PACK_JOOMLA_VERSION_4_0_EXTRA_INFO_2_BODY="<p>Existen numerosos recursos valiosos para agregar tu idioma a Joomla y obtener más información sobre el <a href=\"https://volunteers.joomla.org/teams/joomla-cms-language-team\">Equipo de Idiomas de Joomla! CMS (Core)</a>. Puedes hacer preguntas y obtener consejos en el <a href=\"https://forum.joomla.org/viewforum.php?f=11\">Foro de Traducciones</a> o en el <a href=\"https://forum.joomla.org/viewforum.php?f=809\">Foro de Idiomas</a>, y encontrarás una gran cantidad de recursos en el <a href=\"https://forum.joomla.org/viewforum.php?f=511\">Foro de la Zona Internacional</a>.</p>"
COM_LANGUAGE_PACK_JOOMLA_VERSION_4_0_EXTRA_INFO_2_TITLE="Más información sobre traducciones"
COM_LANGUAGE_PACK_JOOMLA_VERSION_4_0_EXTRA_INFO_3_BODY="Por favor, póngase en contacto con el coordinador de idiomas indicado en la lista de abajo."
COM_LANGUAGE_PACK_JOOMLA_VERSION_4_0_EXTRA_INFO_3_TITLE="¿Tiene algún problema con la calidad de una traducción o desea colaborar con un equipo existente?"

