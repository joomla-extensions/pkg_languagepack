COM_LANGUAGE_PACK_JOOMLA_VERSION_1_0_DESC="جوملا 1.0 علاوه بر زبان اصلی، انگلیسی (بریتانیایی)، همراه با %d بسته زبان معتبر ارائه می‌شود که می‌توانید آن‌ها را در وب‌سایت خود نصب کنید.<br><br><i>توجه داشته باشید که پشتیبانی از نسخه جوملا 1.0 در تاریخ 22 ژوئیه 2009 به پایان رسیده است. شدیداً توصیه می‌شود به یک نسخه پشتیبانی‌شده ارتقا دهید.</i>"
COM_LANGUAGE_PACK_JOOMLA_VERSION_1_5_DESC="جوملا 1.5 علاوه بر زبان اصلی، انگلیسی (بریتانیایی)، همراه با %d بسته زبان معتبر ارائه می‌شود که می‌توانید آن‌ها را در وب‌سایت خود نصب کنید.<br><br><i>توجه داشته باشید که پشتیبانی از نسخه جوملا 1.5 در تاریخ 31 دسامبر 2012 به پایان رسیده است. شدیدا توصیه می‌شود به یک نسخه پشتیبانی‌شده ارتقا دهید.</i>"
COM_LANGUAGE_PACK_JOOMLA_VERSION_2_5_DESC="جوملا 2.5 علاوه بر زبان اصلی، انگلیسی (بریتانیایی)، همراه با %d بسته زبان معتبر ارائه می‌شود که می‌توانید آن‌ها را در وب‌سایت خود نصب کنید.<br><br><i>توجه داشته باشید که پشتیبانی از نسخه جوملا 2.5 در تاریخ 31 دسامبر 2014 به پایان رسیده است. شدیدا توصیه می‌شود به یک نسخه پشتیبانی‌شده ارتقا دهید.</i>"
