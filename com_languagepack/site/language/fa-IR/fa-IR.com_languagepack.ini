COM_LANGUAGE_PACK_JOOMLA_VERSION_3_0_EXTRA_INFO_0_BODY="<p>ترجمه جوملا! به زبان شما با <a href=\"https://docs.joomla.org/J3.1:Making_a_Language_Pack_for_Joomla\">ایجاد یک بسته زبان 3.x</a> آسان است.</p>"
