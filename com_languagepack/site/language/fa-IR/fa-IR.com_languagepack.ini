COM_LANGUAGE_PACK_JOOMLA_VERSION_3_0_EXTRA_INFO_2_BODY="<p>لطفا با <a href=\"https://volunteers.joomla.org/teams/joomla-cms-language-team\">تیم زبان (هسته) سی‌ام‌اس جوملا!</a> تماس بگیرید</p>"
