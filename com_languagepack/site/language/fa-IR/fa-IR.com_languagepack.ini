COM_LANGUAGE_PACK_JOOMLA_VERSION_3_0_EXTRA_INFO_1_BODY="<p>منابع ارزشمند متعددی برای افزودن زبان شما به جوملا و یادگیری بیشتر در مورد <a href=\"https://volunteers.joomla.org/teams/joomla-cms-language-team\">تیم زبان جوملا! سی‌ام‌اس (هسته)</a> وجود دارد. می‌توانید سوالات خود را بپرسید و نکاتی را در <a href=\"https://forum.joomla.org/viewforum.php?f=11\">انجمن ترجمه‌ها</a> یا <a href=\"https://forum.joomla.org/viewforum.php?f=617\">انجمن زبان</a> دریافت کنید و منابع فراوانی در <a href=\"https://forum.joomla.org/viewforum.php?f=511\">انجمن منطقه بین‌المللی</a> وجود دارد.</p>"
